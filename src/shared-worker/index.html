<!doctype html>
<html lang="ja">
  <link>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />

    <title>共有ワーカーのサンプル</title>

    <style>
      * {
        box-sizing: border-box;
      }

      textarea {
        width: 100%;
        min-height: 12vw;
      }

      .controls {
        padding: 4vw;
        width: 75%;
        margin: 10vw auto;
        background-color: rgba(255, 255, 255, 0.7);
        border: 5px solid black;
      }

      .controls p,
      .controls textarea {
        font-size: 3vw;
      }
    </style>
  </head>

  <body>
    <div class="controls" tabindex="0">
      <form>
          <textarea id="textarea">テキスト</textarea>
      </form>

      <p class="result">Result: テキスト</p>
    </div>
    <script src="main.js"></script>
  </body>
</html>
